spring:
  application:
    name: idempotency-demo
  datasource:
    url: jdbc:postgresql://localhost:5432/idempotency_demo
    username: demo
    password: demo
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration
  data:
    rest:
      base-path: /api

# Идемпотентность включена по умолчанию
app:
  idempotency:
    enabled: true
    key-ttl-hours: 24

server:
  port: 8080
