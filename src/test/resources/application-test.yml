spring:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    out-of-order: true
    ignore-migration-patterns: "*:missing"
  data:
    rest:
      base-path: /api

# gRPC: в тестах поднимаем только in-process сервер, network отключён
grpc:
  server:
    port: -1
    in-process-name: idempotency-test

app:
  idempotency:
    enabled: true
    key-ttl-hours: 24
